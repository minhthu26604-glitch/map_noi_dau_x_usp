const tabs=[["mt","Ma trận nỗi đau × USP"],["cd","Thẻ theo tệp"],["us","USP & claim"]];
let tab="mt",open=null,tfil="ALL";
const ico=v=>v==2?'<td class="c m2" title="USP chính">●</td>':v==1?'<td class="c m1" title="Hỗ trợ">○</td>':'<td class="c"></td>';
const chips=(a)=>a.map(i=>'<span class="chip n">'+U[i][0]+' '+U[i][1]+'</span>').join('');
function btn(id,items,cur,cb){const e=document.getElementById(id);e.innerHTML="";items.forEach(([k,l])=>{const b=document.createElement("button");b.textContent=l;if(k===cur)b.className="on";b.onclick=()=>cb(k);e.appendChild(b);});}
function detail(p){return '<div class="card"><h2>'+p.id+' · '+p.n+'</h2><div class="det">'+
'<div><b>Bối cảnh khai thác</b>'+p.ctx+'</div><div><b>Nguyên nhân</b>'+p.cause+'</div>'+
'<div><b>Hook NEEDS gợi ý (2 giây đầu)</b>'+p.hook+'</div><div><b>USP chủ đạo cho NEEDS (tối đa 2)</b>'+(p.t=="B"&&p.id=="B6"?'<span class="lo">Không dùng cho NEEDS; làm CONVERT</span>':chips(p.need.slice(0,2)))+'</div>'+
'<div><b>Mạch NEEDS: Pain → Nguyên nhân → Cơ chế → Lợi ích → Lý do chọn Neo</b>'+p.mech+'</div><div><b>Góc CONVERT: so sánh / chứng minh</b>'+p.conv+'</div>'+
'<div><b>USP hỗ trợ</b>'+chips(p.fit.map((v,i)=>v==1?i:-1).filter(i=>i>=0))+'</div><div><b>USP chính theo mức khớp</b>'+chips(p.fit.map((v,i)=>v==2?i:-1).filter(i=>i>=0))+'</div></div>'+
'<div class="warn"><b>Claim cần tránh với tệp này:</b><ul>'+T[p.t].avoid.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div>';}
function render(){
 btn("tabs",tabs,tab,k=>{tab=k;open=null;render();});
 const v=document.getElementById("view");
 if(tab=="mt"){

  Object.keys(T).filter(k=>tfil=="ALL"||tfil==k).forEach(k=>{
   h+='<tr class="grp"><td colspan="'+(U.length+2)+'" style="color:var('+T[k].color+')">'+T[k].name+'</td></tr>';
   P.filter(p=>p.t==k).forEach(p=>{h+='<tr class="pain" data-id="'+p.id+'"><td class="l"><b>'+p.id+'</b> '+p.n+'</td>'+p.fit.map(ico).join('')+'<td class="l">'+(p.id=="B6"?'<span class="chip">CONVERT</span> '+chips(p.need):chips(p.need.slice(0,2)))+'</td></tr>';

  });

  btn("tf",[["ALL","Cả 3 tệp"],["H","Hôi miệng"],["O","N-OC-01"],["B","Niềng"]],tfil,k=>{tfil=k;render();});
  v.querySelectorAll("tr.pain").forEach(r=>r.onclick=()=>{open=open==r.dataset.id?null:r.dataset.id;render();});
 } else if(tab=="cd"){
  let h='<div class="g3">';
  Object.keys(T).forEach(k=>{
   const ps=P.filter(p=>p.t==k);
   h+='<div class="card"><h2 style="color:var('+T[k].color+')">'+T[k].name+'</h2><p class="sub">'+T[k].desc+'</p><p style="margin:10px 0 4px"><b>Nỗi đau và USP chủ đạo</b></p><ul>'+ps.map(p=>'<li><b>'+p.id+'</b> '+p.n+'<br>'+(p.id=="B6"?'<span class="chip">CONVERT</span> ':'')+chips(p.id=="B6"?p.need:p.need.slice(0,2))+'</li>').join('')+'</ul><div class="warn"><b>Claim cần tránh</b><ul>'+T[k].avoid.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div>';});
  v.innerHTML=h+'</div>';
 } else {
  v.innerHTML='<div class="card sc"><h2>Danh sách USP đưa vào map</h2><table><tr><th class="l">Mã</th><th class="l">USP</th><th class="l">Nội dung theo tài liệu</th></tr>'+U.map(u=>'<tr><td class="l"><b>'+u[0]+'</b></td><td class="l">'+u[1]+'</td><td class="l" style="white-space:normal">'+u[2]+'</td></tr>').join('')+'</table></div><div class="card"><h2>Cách đọc map</h2><ul><li><b>NEEDS (70%):</b> chọn tối đa 2 USP chủ đạo cho mỗi video, theo cột cuối của ma trận. Mỗi video: 1 tệp, 1 pain, 1 bối cảnh, 2 USP.</li><li><b>CONVERT (30%):</b> hook gọi thẳng một USP khác biệt, rồi so sánh với tăm nước khác. Dùng USP ● của pain đó làm góc so sánh.</li><li>Mức khớp ●/○ là đánh giá từ cơ chế và pain trong persona. Nên kiểm chứng lại bằng số liệu của các video đã chạy trước khi coi là cố định.</li><li>Tệp hôi miệng và niềng ở tầng nhận thức cao: ưu tiên proof cơ chế và gom bước, không giải thích pain dài.</li></ul></div>';}
}
render();
</script></body></html>
